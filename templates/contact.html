<!-- templates/contact.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | FoodieExpress</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0ffff;
      margin: 0;
    }
    nav {
      background-color: navy;
      padding: 15px;
      text-align: center;
    }
    nav a {
      margin: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    header {
      text-align: center;
      padding: 30px;
    }
    form {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    form input, form textarea {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    form textarea {
      height: 120px;
      resize: vertical;
    }
    form button {
      background-color: navy;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    form button:hover {
      background-color: #00008b;
    }
    .images {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px;
    }
    .images img {
      width: 30%;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }
    @media (max-width: 768px) {
      .images img {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('menu') }}">Menu</a>
    <a href="{{ url_for('order') }}">Order</a>
    <a href="{{ url_for('payment') }}">Payment</a>
    <a href="{{ url_for('contact') }}">Contact</a>
  </nav>

  <!-- Header -->
  <header>
    <h1>Get in Touch</h1>
    <p>Have questions or feedback? We'd love to hear from you!</p>
  </header>

  <!-- Contact Form -->
  <form onsubmit="return validateContactForm()">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <textarea id="message" placeholder="Your Message" required></textarea>
    <button type="submit">Send</button>
    <form method="POST" action="{{ url_for('payment') }}">
  </form>

  <!-- Contact Images -->
  <div class="images">
    <img src="{{ url_for('static', filename='images/contact1.png') }}" alt="Customer Service">
    <img src="{{ url_for('static', filename='images/contact2.png') }}" alt="Support">
    <img src="{{ url_for('static', filename='images/contact3.png') }}" alt="Email Contact">
    <img src="{{ url_for('static', filename='images/contact4.png') }}" alt="Chat With Us">
    <img src="{{ url_for('static', filename='images/contact5.png') }}" alt="Phone Support">
  </div>

  <!-- JavaScript for validation -->
  <script>
    function validateContactForm() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (name.length < 3) {
        alert("Please enter a valid name (at least 3 characters).");
        return false;
      }

      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      if (!emailPattern.test(email)) {
        alert("Please enter a valid email address.");
        return false;
      }

      if (message.length < 10) {
        alert("Message should be at least 10 characters.");
        return false;
      }

      alert("Thank you for contacting us! We will respond shortly.");
      return true;
    }
  </script>

</body>
</html>
