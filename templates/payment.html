<!-- templates/payment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Payment | FoodieExpress</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff0f5;
      margin: 0;
    }
    nav {
      background-color: purple;
      padding: 15px;
      text-align: center;
    }
    nav a {
      margin: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    header {
      text-align: center;
      padding: 30px;
    }
    form {
      background: #fff;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    form input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    form button {
      background-color: purple;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    form button:hover {
      background-color: darkmagenta;
    }
    .card-type {
      font-weight: bold;
      color: purple;
      text-align: center;
      margin-top: -10px;
    }
    .images {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px;
    }
    .images img {
      width: 30%;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('menu') }}">Menu</a>
    <a href="{{ url_for('order') }}">Order</a>
    <a href="{{ url_for('payment') }}">Payment</a>
    <a href="{{ url_for('contact') }}">Contact</a>
  </nav>

  <!-- Header -->
  <header>
    <h1>Secure Payment</h1>
    <p>Enter your card details to complete your order</p>
  </header>

  <!-- Payment Form -->
  <form onsubmit="return validatePayment()">
    <input type="text" id="cardNumber" maxlength="19" placeholder="Card Number (XXXX XXXX XXXX XXXX)" required oninput="detectCardType(this)">
    <div class="card-type" id="cardType"></div>

    <input type="text" id="expiryDate" placeholder="Expiry Date (MM/YY)" required>
    <input type="text" id="cvv" maxlength="3" placeholder="CVV" required>

    <button type="submit">Pay Now</button>
    <form method="POST" action="{{ url_for('payment') }}">

  </form>

  <!-- Images -->
  <div class="images">
    <img src="{{ url_for('static', filename='images/payment1.png') }}" alt="Payment 1">
    <img src="{{ url_for('static', filename='images/payment2.png') }}" alt="Payment 2">
    <img src="{{ url_for('static', filename='images/payment3.png') }}" alt="Payment 3">
    <img src="{{ url_for('static', filename='images/payment4.png') }}" alt="Payment 4">
    <img src="{{ url_for('static', filename='images/payment5.png') }}" alt="Payment 5">
  </div>

  <!-- JavaScript -->
  <script>
    function detectCardType(input) {
      const value = input.value.replace(/\s/g, '');
      let cardType = "Unknown";

      if (/^4/.test(value)) cardType = "Visa";
      else if (/^5[1-5]/.test(value)) cardType = "MasterCard";

      document.getElementById("cardType").innerText = cardType;
      // Format: XXXX XXXX XXXX XXXX
      input.value = value.replace(/(\d{4})/g, '$1 ').trim();
    }

    function validatePayment() {
      const cardNumber = document.getElementById("cardNumber").value.replace(/\s/g, '');
      const expiry = document.getElementById("expiryDate").value.trim();
      const cvv = document.getElementById("cvv").value.trim();

      if (!/^\d{16}$/.test(cardNumber)) {
        alert("Card number must be 16 digits.");
        return false;
      }

      if (!/^\d{2}\/\d{2}$/.test(expiry)) {
        alert("Expiry must be in MM/YY format.");
        return false;
      }

      if (!/^\d{3}$/.test(cvv)) {
        alert("CVV must be 3 digits.");
        return false;
      }

      alert("Payment successful! Thank you for your order.");
      return true; // Or integrate with backend
    }
  </script>

</body>
</html>
