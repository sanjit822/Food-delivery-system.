<!-- templates/order.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Now | FoodieExpress</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e0ffe0;
      margin: 0;
    }
    nav {
      background-color: darkgreen;
      padding: 15px;
      text-align: center;
    }
    nav a {
      margin: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    header {
      text-align: center;
      padding: 30px;
    }
    form {
      background: #ffffff;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    form input, form select {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    form button {
      background-color: darkgreen;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    form button:hover {
      background-color: #006400;
    }
    .total {
      font-weight: bold;
      color: darkgreen;
      margin-top: 10px;
      text-align: center;
    }
    .images {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px;
    }
    .images img {
      width: 30%;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('menu') }}">Menu</a>
    <a href="{{ url_for('order') }}">Order</a>
    <a href="{{ url_for('payment') }}">Payment</a>
    <a href="{{ url_for('contact') }}">Contact</a>
  </nav>

  <!-- Header -->
  <header>
    <h1>Place Your Order</h1>
    <p>Fill in your details and choose your favorite dish!</p>
  </header>

  <!-- Order Form -->
  <form onsubmit="return submitOrder()">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="text" id="address" placeholder="Your Address" required>

    <select id="item" onchange="updatePrice()" required>
      <option value="">Select Food Item</option>
      <option value="Paneer Tikka" data-price="150">Paneer Tikka - ₹150</option>
      <option value="Chicken Biryani" data-price="180">Chicken Biryani - ₹180</option>
      <option value="Veg Biryani" data-price="140">Veg Biryani - ₹140</option>
      <option value="Mutton Kebab" data-price="220">Mutton Kebab - ₹220</option>
      <option value="Masala Dosa" data-price="100">Masala Dosa - ₹100</option>
    </select>

    <input type="number" id="quantity" min="1" value="1" onchange="updatePrice()" required placeholder="Quantity">

    <div class="total" id="totalCost">Total: ₹0</div>

    <button type="submit">Submit Order</button>
  </form>

  <!-- Images -->
  <div class="images">
    <img src="{{ url_for('static', filename='images/food1.png') }}" alt="Order Food 1">
    <img src="{{ url_for('static', filename='images/food2.png') }}" alt="Order Food 2">
    <img src="{{ url_for('static', filename='images/food3.png') }}" alt="Order Food 3">
    <img src="{{ url_for('static', filename='images/menu2.png') }}" alt="Order Food 4">
    <img src="{{ url_for('static', filename='images/menu3.png') }}" alt="Order Food 5">
  </div>

  <!-- JS -->
  <script>
    function updatePrice() {
      const item = document.getElementById('item');
      const quantity = document.getElementById('quantity').value || 1;
      const price = item.options[item.selectedIndex].getAttribute('data-price');
      const total = price ? quantity * price : 0;
      document.getElementById('totalCost').innerText = "Total: ₹" + total;
    }

    function submitOrder() {
      const name = document.getElementById('name').value.trim();
      const address = document.getElementById('address').value.trim();
      const item = document.getElementById('item').value;
      const quantity = document.getElementById('quantity').value;

      if (!name || !address || !item || quantity < 1) {
        alert("Please fill all fields correctly.");
        return false;
      }

      alert("Thank you " + name + "! Your order for " + quantity + " x " + item + " has been placed.");
      return true; // Or submit to Flask backend
    }
  </script>

</body>
</html>
